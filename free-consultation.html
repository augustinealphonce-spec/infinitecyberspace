<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Cybersecurity Consultation | Infinite Cyberspace Hub</title>
  <link rel="canonical" href="https://infinitecyberspace.vercel.app/free-consultation.html" />
  <meta name="description" content="Book a free 20–30 minute cybersecurity consultation for your Kenyan business. Kisumu-based team, practical advice, no obligation." />
  <meta property="og:title" content="Free Consultation | Infinite Cyberspace Hub" />
  <meta property="og:url" content="https://infinitecyberspace.vercel.app/free-consultation.html" />
  <meta property="og:image" content="https://infinitecyberspace.vercel.app/logo.png" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="packages.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-[#050505] text-zinc-200 font-['Inter']">

  <!-- paste same navbar as index.html (without text-cyan-300 hardcode on Home only) -->

  <section class="relative py-16 md:py-24">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-cyan-900/20 via-transparent to-transparent pointer-events-none"></div>
    <div class="max-w-2xl mx-auto px-6 relative z-10">
      <div class="text-center mb-10">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-cyan-500/30 bg-cyan-500/10 text-cyan-400 text-sm font-medium mb-6">
          <i class="fas fa-comments"></i> 20–30 min · No obligation
        </div>
        <h1 class="text-4xl md:text-5xl font-bold mb-4 bg-gradient-to-r from-white via-cyan-100 to-cyan-400 bg-clip-text text-transparent">
          Free Security Consultation
        </h1>
        <p class="text-zinc-400 text-lg">
          Tell us about your environment. We’ll outline practical next steps — packages only if they fit.
        </p>
      </div>

      <div id="consult-success" class="hidden rounded-2xl border border-cyan-500/30 bg-cyan-500/10 p-8 text-center">
        <h2 class="text-xl font-bold text-cyan-300 mb-2">Request received</h2>
        <p class="text-zinc-400 mb-4">We’ll contact you shortly. For urgent issues, WhatsApp us now.</p>
        <a id="consult-wa" href="#" class="inline-flex items-center gap-2 text-green-400 font-semibold hover:underline">
          <i class="fab fa-whatsapp"></i> WhatsApp +254 768 741 052
        </a>
      </div>

      <form id="consult-form" class="space-y-5 rounded-2xl border border-zinc-700/70 bg-zinc-950/60 p-6 md:p-8">
        <!-- Use your real Splitforms access key -->
        <input type="hidden" name="access_key" value="82fb0ce9253b465cbb8c35121241ebcd" />
        <input type="hidden" name="subject" value="Free Consultation Request – Infinite Cyberspace Hub" />
        <input type="checkbox" name="botcheck" class="hidden" tabindex="-1" autocomplete="off" />

        <div class="grid md:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm text-zinc-400 mb-1.5">Full name *</label>
            <input name="name" required class="w-full rounded-xl bg-black/50 border border-zinc-700 px-4 py-3 focus:border-cyan-500 outline-none" />
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-1.5">Company</label>
            <input name="company" class="w-full rounded-xl bg-black/50 border border-zinc-700 px-4 py-3 focus:border-cyan-500 outline-none" />
          </div>
        </div>
        <div class="grid md:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm text-zinc-400 mb-1.5">Work email *</label>
            <input type="email" name="email" required class="w-full rounded-xl bg-black/50 border border-zinc-700 px-4 py-3 focus:border-cyan-500 outline-none" />
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-1.5">Phone / WhatsApp *</label>
            <input type="tel" name="phone" required class="w-full rounded-xl bg-black/50 border border-zinc-700 px-4 py-3 focus:border-cyan-500 outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-sm text-zinc-400 mb-1.5">Team size</label>
          <select name="team_size" class="w-full rounded-xl bg-black/50 border border-zinc-700 px-4 py-3 focus:border-cyan-500 outline-none">
            <option value="">Select…</option>
            <option>1–10</option>
            <option>11–50</option>
            <option>51–200</option>
            <option>200+</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-zinc-400 mb-1.5">Biggest concerns</label>
          <textarea name="concerns" rows="4" placeholder="Ransomware, phishing, M365, compliance…" class="w-full rounded-xl bg-black/50 border border-zinc-700 px-4 py-3 focus:border-cyan-500 outline-none"></textarea>
        </div>
        <label class="flex items-start gap-3 text-sm text-zinc-400">
          <input type="checkbox" name="consent" required class="mt-1" />
          <span>I agree to the <a href="privacy.html" class="text-cyan-400 hover:underline">Privacy Policy</a>.</span>
        </label>
        <p id="consult-error" class="hidden text-red-400 text-sm text-center"></p>
        <button type="submit" id="consult-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-semibold py-4 rounded-xl transition">
          Book free consultation
        </button>
        <p class="text-center text-xs text-zinc-500">
          Prefer chat?
          <a href="https://wa.me/254768741052?text=Hello%20Infinite%20Cyberspace%20Hub%2C%20I%20want%20a%20free%20consultation." class="text-green-400 hover:underline">WhatsApp us</a>
        </p>
      </form>
    </div>
  </section>

  <!-- footer same as other pages -->

  <script src="site.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('consult-form');
      if (!form) return;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('consult-btn');
        const err = document.getElementById('consult-error');
        err.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Sending…';
        try {
          const res = await fetch('https://splitforms.com/api/submit', {
            method: 'POST',
            body: new FormData(form),
            headers: { Accept: 'application/json' }
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.success) throw new Error(data.message || 'Submit failed');
          form.classList.add('hidden');
          document.getElementById('consult-success').classList.remove('hidden');
          const name = form.name.value || 'Client';
          document.getElementById('consult-wa').href =
            'https://wa.me/254768741052?text=' +
            encodeURIComponent('Hello, I just requested a free consultation. Name: ' + name);
        } catch (ex) {
          err.textContent = 'Could not send. Please WhatsApp +254 768 741 052.';
          err.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Book free consultation';
        }
      });
    });
  </script>
  <script src="chatbot.js" defer></script>
</body>
</html>
