<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account | Infinite Cyberspace Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="infinite-cyberspace-favicon.png" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { void: { 950: '#050508', 900: '#0a0a10', 800: '#12121a' } }
        }
      }
    }
  </script>
  <style>
    body { background: #050508; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; }
    .glass {
      background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid rgba(148,163,184,0.1);
      backdrop-filter: blur(14px);
    }
    .glass-accent {
      background: linear-gradient(135deg, rgba(34,211,238,0.1), rgba(99,102,241,0.07));
      border: 1px solid rgba(34,211,238,0.2);
    }
    .btn-g {
      background: linear-gradient(135deg, #3b82f6, #22d3ee);
      color: #020617; font-weight: 700;
    }
    .btn-g:hover { filter: brightness(1.06); box-shadow: 0 8px 28px rgba(34,211,238,0.22); }
    .btn-ghost { border: 1px solid rgba(148,163,184,0.2); color: #cbd5e1; }
    .btn-ghost:hover { background: rgba(255,255,255,0.04); border-color: rgba(34,211,238,0.3); }
    .nav-i.active {
      background: linear-gradient(90deg, rgba(34,211,238,0.12), transparent);
      color: #22d3ee;
      border-left: 2px solid #22d3ee;
    }
    .grid-bg {
      background-image:
        linear-gradient(rgba(34,211,238,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .chip { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .s-ok { background: rgba(16,185,129,.18); color: #6ee7b7; }
    .s-open { background: rgba(59,130,246,.2); color: #93c5fd; }
    .s-warn { background: rgba(245,158,11,.2); color: #fcd34d; }
    .s-bad { background: rgba(239,68,68,.18); color: #fca5a5; }
    .pulse { animation: p 2s ease-in-out infinite; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.2);
      border-top-color: #22d3ee; border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    input, select, textarea { color-scheme: dark; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen antialiased">

  <!-- LOGIN -->
  <div id="login-screen" class="min-h-screen grid-bg flex items-center justify-center p-4 relative">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(34,211,238,0.12),_transparent_55%)]"></div>
    <div class="relative z-10 w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex w-14 h-14 rounded-2xl glass-accent items-center justify-center mb-4">
          <i class="fas fa-shield-halved text-2xl text-cyan-400"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">Welcome back</h1>
        <p class="text-slate-500 text-sm mt-1">Sign in to your Infinite Cyberspace account</p>
      </div>
      <div class="glass rounded-3xl p-7 shadow-2xl">
        <div id="login-error" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/25 text-red-300 text-sm"></div>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Work email</label>
            <input id="login-email" type="email" placeholder="you@company.com" autocomplete="username"
              class="w-full px-4 py-3 rounded-xl bg-void-900 border border-slate-700/80 text-sm outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/20 transition" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
            <div class="relative">
              <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"
                class="w-full px-4 py-3 rounded-xl bg-void-900 border border-slate-700/80 text-sm outline-none focus:border-cyan-500/50 pr-11"
                onkeydown="if(event.key==='Enter')doLogin()" />
              <button type="button" onclick="togglePw()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-sm" aria-label="Show password">
                <i id="pw-icon" class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <!-- Toggle -->
<div class="flex gap-2 mb-4 text-xs">
  <button type="button" id="tab-login" onclick="setAuthTab('login')"
    class="flex-1 py-2 rounded-lg bg-cyan-500/15 text-cyan-400 font-medium">Sign in</button>
  <button type="button" id="tab-register" onclick="setAuthTab('register')"
    class="flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-300">Create account</button>
</div>

<div id="reg-fields" class="hidden space-y-3 mb-3">
  <div>
    <label class="block text-xs font-medium text-slate-400 mb-1.5">Full name</label>
    <input id="reg-name" type="text" placeholder="Jane Doe"
      class="w-full px-4 py-3 rounded-xl bg-void-900 border border-slate-700/80 text-sm outline-none focus:border-cyan-500/50" />
  </div>
  <div>
    <label class="block text-xs font-medium text-slate-400 mb-1.5">Company (optional)</label>
    <input id="reg-company" type="text" placeholder="Acme Ltd"
      class="w-full px-4 py-3 rounded-xl bg-void-900 border border-slate-700/80 text-sm outline-none focus:border-cyan-500/50" />
  </div>
</div>
        <button type="button" id="login-btn" onclick="doAuth()" class="btn-g w-full py-3 rounded-xl text-sm mt-1 flex items-center justify-center gap-2">
  Sign in securely
</button>
        </div>
        <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
          <p class="text-[11px] text-slate-500 leading-relaxed">
            Demo access<br />
            <span class="text-cyan-400/90">demo@client.com</span> · <span class="text-cyan-400/90">demo123</span>
          </p>
          <a href="index.html" class="inline-block mt-3 text-[11px] text-slate-600 hover:text-cyan-400 transition">← Back to website</a>
        </div>
      </div>
      <p class="text-center text-[10px] text-slate-600 mt-6">Protected connection · Kisumu, Kenya</p>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden min-h-screen flex">
    <aside id="sidebar" class="w-[240px] shrink-0 border-r border-slate-800/60 bg-void-900/95 flex flex-col fixed md:sticky top-0 h-screen z-40 -translate-x-full md:translate-x-0 transition-transform duration-200">
      <div class="p-4 border-b border-slate-800/60">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-cyan-500/15">
            <i class="fas fa-shield-halved text-void-950 text-sm"></i>
          </div>
          <div>
            <div class="font-bold text-sm tracking-tight">INFINITE<span class="text-cyan-400">CYBER</span></div>
            <div class="text-[10px] text-slate-500">Client account</div>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-2 space-y-0.5 overflow-y-auto text-[13px]">
        <button type="button" class="nav-i active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left" data-v="home" onclick="go('home')">
          <i class="fas fa-house w-5 text-center opacity-70"></i> Home
        </button>
        <button type="button" class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="protection" onclick="go('protection')">
          <i class="fas fa-shield-virus w-5 text-center opacity-70"></i> Protection
        </button>
        <button type="button" class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="support" onclick="go('support')">
          <i class="fas fa-headset w-5 text-center opacity-70"></i> Support
          <span id="badge-tickets" class="ml-auto chip s-open hidden">0</span>
        </button>
        <button type="button" class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="documents" onclick="go('documents')">
          <i class="fas fa-folder-open w-5 text-center opacity-70"></i> Documents
        </button>
        <button type="button" class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="billing" onclick="go('billing')">
          <i class="fas fa-receipt w-5 text-center opacity-70"></i> Billing
        </button>
        <div class="pt-3 mt-2 border-t border-slate-800/60">
          <button type="button" class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="profile" onclick="go('profile')">
            <i class="fas fa-user w-5 text-center opacity-70"></i> Profile
          </button>
        </div>
      </nav>
      <div class="p-3 border-t border-slate-800/60">
        <div class="flex items-center gap-2.5 mb-2">
          <div id="side-av" class="w-9 h-9 rounded-full bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-xs font-bold"></div>
          <div class="min-w-0 flex-1">
            <div id="side-name" class="text-xs font-semibold truncate"></div>
            <div id="side-co" class="text-[10px] text-slate-500 truncate"></div>
          </div>
        </div>
        <button type="button" onclick="doLogout()" class="w-full text-[11px] text-slate-500 hover:text-red-400 py-1.5 rounded-lg hover:bg-red-500/5 transition">
          Sign out
        </button>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="sticky top-0 z-30 h-14 border-b border-slate-800/60 bg-void-950/85 backdrop-blur-xl px-4 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button type="button" class="md:hidden p-2 rounded-lg text-slate-400 hover:bg-white/5" onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" aria-label="Menu">
            <i class="fas fa-bars"></i>
          </button>
          <div class="min-w-0">
            <h1 id="page-title" class="text-sm font-semibold truncate">Home</h1>
            <p id="page-sub" class="text-[10px] text-slate-500 truncate">Your security at a glance</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div id="prot-badge" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-[10px] text-emerald-400 font-medium">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse"></span> Protected
          </div>
          <button type="button" onclick="go('support'); setTimeout(openTicketModal, 80)" class="btn-g hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs">
            <i class="fas fa-plus text-[10px]"></i> Get help
          </button>
        </div>
      </header>
      <main id="main" class="flex-1 overflow-y-auto p-4 md:p-6 grid-bg"></main>
    </div>
  </div>

  <!-- Ticket modal -->
  <div id="ticket-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
    <div class="glass rounded-2xl w-full max-w-md p-6 border border-cyan-500/15 shadow-2xl">
      <div class="flex justify-between items-center mb-5">
        <div>
          <h3 class="font-semibold">Request support</h3>
          <p class="text-[11px] text-slate-500 mt-0.5">We typically respond within 2 hours</p>
        </div>
        <button type="button" onclick="closeTicketModal()" class="text-slate-400 hover:text-white text-xl leading-none" aria-label="Close">&times;</button>
      </div>
      <div id="ticket-err" class="hidden mb-3 text-sm text-red-300"></div>
      <div class="space-y-3">
        <div>
          <label class="text-[11px] text-slate-500 mb-1 block">What do you need help with?</label>
          <input id="t-subject" type="text" placeholder="Short summary"
            class="w-full px-3.5 py-2.5 rounded-xl bg-void-900 border border-slate-700 text-sm outline-none focus:border-cyan-500/40" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[11px] text-slate-500 mb-1 block">Category</label>
            <select id="t-cat" class="w-full px-3 py-2.5 rounded-xl bg-void-900 border border-slate-700 text-sm">
              <option>Security incident</option>
              <option>Device / endpoint</option>
              <option>Email or phishing</option>
              <option>Network / VPN</option>
              <option>Account or billing</option>
              <option>General question</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] text-slate-500 mb-1 block">Urgency</label>
            <select id="t-pri" class="w-full px-3 py-2.5 rounded-xl bg-void-900 border border-slate-700 text-sm">
              <option value="Low">Low — can wait</option>
              <option value="Medium" selected>Medium — soon</option>
              <option value="High">High — urgent</option>
              <option value="Critical">Critical — outage / breach</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-[11px] text-slate-500 mb-1 block">Details</label>
          <textarea id="t-desc" rows="4" placeholder="Describe the issue..."
            class="w-full px-3.5 py-2.5 rounded-xl bg-void-900 border border-slate-700 text-sm outline-none focus:border-cyan-500/40 resize-none"></textarea>
        </div>
        <button type="button" id="t-submit" onclick="submitTicket()" class="btn-g w-full py-2.5 rounded-xl text-sm flex items-center justify-center gap-2">
          Submit request
        </button>
      </div>
    </div>
  </div>

<script>
(function () {
 const API_ROOT = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:3000'
  : 'https://YOUR-BACKEND-URL'; // replace after deploy (Railway, Render, VPS, etc.)

  const AUTH_KEY = 'ich_auth_token';
  const USER_KEY = 'ich_user';

  let state = {
    user: null,
    subscription: null,
    tickets: [],
    payments: [],
    reports: []
  };

  function token() { return localStorage.getItem(AUTH_KEY); }
  function saveUser(u) {
    state.user = u;
    localStorage.setItem(USER_KEY, JSON.stringify(u));
  }
  function loadStoredUser() {
    try { return JSON.parse(localStorage.getItem(USER_KEY) || 'null'); } catch { return null; }
  }

  async function api(path, opts = {}) {
    const headers = Object.assign(
      { 'Content-Type': 'application/json' },
      token() ? { Authorization: 'Bearer ' + token() } : {},
      opts.headers || {}
    );
    const res = await fetch(API_ROOT + path, Object.assign({}, opts, { headers }));
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) {
      doLogout(true);
      throw new Error('Session expired');
    }
    if (!res.ok) throw new Error(data.message || 'Request failed');
    return data;
  }

  function initials(name) {
    if (!name) return '?';
    return name.split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function statusChip(status) {
    const s = (status || '').toLowerCase();
    let cls = 's-open';
    if (s === 'resolved' || s === 'closed' || s === 'success' || s === 'active') cls = 's-ok';
    if (s === 'failed' || s === 'cancelled' || s === 'critical') cls = 's-bad';
    if (s === 'pending' || s === 'in progress' || s === 'escalated') cls = 's-warn';
    return '<span class="chip ' + cls + '">' + esc(status) + '</span>';
  }

  function togglePw() {
    const i = document.getElementById('login-password');
    const icon = document.getElementById('pw-icon');
    if (i.type === 'password') { i.type = 'text'; icon.className = 'fas fa-eye-slash'; }
    else { i.type = 'password'; icon.className = 'fas fa-eye'; }
  }

  async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const err = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');
    err.classList.add('hidden');

    if (!email || !password) {
      err.textContent = 'Enter email and password';
      err.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';

    try {
      const data = await fetch(API_ROOT + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      }).then(async r => {
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.message || 'Login failed');
        return j;
      });

      if (data.user.role === 'admin') {
        // optional: send admins to admin panel
        localStorage.setItem(AUTH_KEY, data.token);
        saveUser(data.user);
        window.location.href = 'admin.html';
        return;
      }

      localStorage.setItem(AUTH_KEY, data.token);
      saveUser(data.user);
      await bootApp();
    } catch (e) {
      err.textContent = e.message || 'Cannot reach server';
      err.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in securely';
    }
  }

  function doLogout(silent) {
    localStorage.removeItem(AUTH_KEY);
    localStorage.removeItem(USER_KEY);
    state = { user: null, subscription: null, tickets: [], payments: [], reports: [] };
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    if (!silent) location.hash = '';
  }

  async function refreshData() {
    const [sub, tickets, payments, reports] = await Promise.all([
      api('/api/me/subscription'),
      api('/api/me/tickets'),
      api('/api/me/payments'),
      api('/api/me/reports')
    ]);
    state.subscription = sub.subscription || null;
    state.tickets = tickets.tickets || [];
    state.payments = payments.payments || [];
    state.reports = reports.reports || [];

    const open = state.tickets.filter(t => !['Resolved', 'Closed'].includes(t.status)).length;
    const badge = document.getElementById('badge-tickets');
    if (open > 0) {
      badge.textContent = String(open);
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }

    const prot = document.getElementById('prot-badge');
    if (state.subscription && state.subscription.status === 'active') {
      prot.classList.remove('hidden');
      prot.classList.add('sm:flex');
    } else {
      prot.classList.add('hidden');
      prot.classList.remove('sm:flex');
    }
  }

  function fillSidebar() {
    const u = state.user;
    document.getElementById('side-name').textContent = u.name || u.email;
    document.getElementById('side-co').textContent = u.company || 'Client';
    document.getElementById('side-av').textContent = initials(u.name || u.email);
  }

  async function bootApp() {
    if (!token()) return;
    try {
      const me = await api('/api/auth/me');
      saveUser(me.user);
      fillSidebar();
      await refreshData();
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      go(location.hash.replace('#', '') || 'home');
    } catch (e) {
      doLogout(true);
    }
  }
let authTab = 'login'; // 'login' | 'register'

function setAuthTab(tab) {
  authTab = tab;
  const reg = document.getElementById('reg-fields');
  const btn = document.getElementById('login-btn');
  const tLogin = document.getElementById('tab-login');
  const tReg = document.getElementById('tab-register');
  if (tab === 'register') {
    reg.classList.remove('hidden');
    btn.textContent = 'Create account';
    tLogin.className = 'flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-300';
    tReg.className = 'flex-1 py-2 rounded-lg bg-cyan-500/15 text-cyan-400 font-medium';
  } else {
    reg.classList.add('hidden');
    btn.textContent = 'Sign in securely';
    tLogin.className = 'flex-1 py-2 rounded-lg bg-cyan-500/15 text-cyan-400 font-medium';
    tReg.className = 'flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-300';
  }
}

async function doAuth() {
  if (authTab === 'register') return doRegister();
  return doLogin();
}

async function doRegister() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const name = document.getElementById('reg-name').value.trim();
  const company = document.getElementById('reg-company').value.trim();
  const err = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  err.classList.add('hidden');

  if (!name || !email || !password) {
    err.textContent = 'Name, email and password are required';
    err.classList.remove('hidden');
    return;
  }
  if (password.length < 6) {
    err.textContent = 'Password must be at least 6 characters';
    err.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Creating account...';

  try {
    const res = await fetch(API_ROOT + '/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, name, company: company || null })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Registration failed');

    localStorage.setItem(AUTH_KEY, data.token);
    saveUser(data.user);
    await bootApp();
  } catch (e) {
    err.textContent = e.message || 'Cannot reach server';
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
}

// keep Enter key working
// on password field: onkeydown="if(event.key==='Enter')doAuth()"

window.setAuthTab = setAuthTab;
window.doAuth = doAuth;
window.doRegister = doRegister;

  const titles = {
    home: ['Home', 'Your security at a glance'],
    protection: ['Protection', 'Active package & coverage'],
    support: ['Support', 'Tickets and requests'],
    documents: ['Documents', 'Reports and files'],
    billing: ['Billing', 'Payments and receipts'],
    profile: ['Profile', 'Account details']
  };

  function go(view) {
    if (!titles[view]) view = 'home';
    location.hash = view;
    document.getElementById('page-title').textContent = titles[view][0];
    document.getElementById('page-sub').textContent = titles[view][1];
    document.querySelectorAll('.nav-i').forEach(b => {
      const on = b.dataset.v === view;
      b.classList.toggle('active', on);
      b.classList.toggle('text-slate-400', !on);
    });
    // close mobile sidebar
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebar').classList.remove('md:translate-x-0');
    // re-apply md sticky open
    if (window.matchMedia('(min-width: 768px)').matches) {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
    }

    const main = document.getElementById('main');
    if (view === 'home') main.innerHTML = renderHome();
    if (view === 'protection') main.innerHTML = renderProtection();
    if (view === 'support') main.innerHTML = renderSupport();
    if (view === 'documents') main.innerHTML = renderDocuments();
    if (view === 'billing') main.innerHTML = renderBilling();
    if (view === 'profile') main.innerHTML = renderProfile();
  }

  function renderHome() {
    const u = state.user;
    const sub = state.subscription;
    const openTickets = state.tickets.filter(t => !['Resolved', 'Closed'].includes(t.status)).length;
    const lastPay = state.payments.find(p => p.status === 'success');

    return `
      <div class="max-w-5xl mx-auto space-y-5">
        <div class="glass rounded-2xl p-5 md:p-6">
          <p class="text-xs text-slate-500 mb-1">Signed in as</p>
          <h2 class="text-xl font-bold">Hello, ${esc(u.name || 'there')}</h2>
          <p class="text-sm text-slate-400 mt-1">${esc(u.company || '')}</p>
        </div>
        <div class="grid sm:grid-cols-3 gap-4">
          <div class="glass rounded-2xl p-4">
            <div class="text-[11px] text-slate-500 mb-1">Protection</div>
            <div class="font-semibold text-sm">${sub ? esc(sub.package_name) : 'No active plan'}</div>
            <div class="mt-2">${sub ? statusChip(sub.status) : statusChip('None')}</div>
          </div>
          <div class="glass rounded-2xl p-4">
            <div class="text-[11px] text-slate-500 mb-1">Open tickets</div>
            <div class="text-2xl font-bold text-cyan-400">${openTickets}</div>
          </div>
          <div class="glass rounded-2xl p-4">
            <div class="text-[11px] text-slate-500 mb-1">Last payment</div>
            <div class="font-semibold text-sm">${lastPay ? 'KES ' + Number(lastPay.amount).toLocaleString() : '—'}</div>
            <div class="text-[10px] text-slate-500 mt-1">${lastPay ? esc(lastPay.mpesa_receipt || lastPay.created_at || '') : ''}</div>
          </div>
        </div>
        <div class="glass rounded-2xl p-5 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
          <div>
            <div class="font-semibold text-sm">Need help?</div>
            <p class="text-xs text-slate-500 mt-0.5">Open a support ticket — critical issues are prioritised.</p>
          </div>
          <button type="button" onclick="openTicketModal()" class="btn-g px-4 py-2 rounded-xl text-xs">Create ticket</button>
        </div>
        <div class="glass rounded-2xl p-5">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-semibold text-sm">Recent tickets</h3>
            <button type="button" onclick="go('support')" class="text-xs text-cyan-400">View all</button>
          </div>
          ${state.tickets.slice(0, 3).map(t => `
            <div class="flex justify-between gap-3 py-2.5 border-b border-slate-800/50 last:border-0">
              <div class="min-w-0">
                <div class="text-sm font-medium truncate">${esc(t.subject)}</div>
                <div class="text-[10px] text-slate-500">${esc(t.ticket_id)} · ${esc(t.created_at || '')}</div>
              </div>
              ${statusChip(t.status)}
            </div>`).join('') || '<p class="text-sm text-slate-500">No tickets yet.</p>'}
        </div>
      </div>`;
  }

  function renderProtection() {
    const sub = state.subscription;
    if (!sub) {
      return `
        <div class="max-w-lg mx-auto glass rounded-2xl p-8 text-center">
          <i class="fas fa-shield-halved text-3xl text-slate-600 mb-4"></i>
          <h2 class="font-bold mb-2">No active protection</h2>
          <p class="text-sm text-slate-400 mb-5">Choose a package and pay via Lipa na M-Pesa to activate coverage.</p>
          <a href="packages.html" class="btn-g inline-flex px-5 py-2.5 rounded-xl text-sm">View packages</a>
        </div>`;
    }
    const features = Array.isArray(sub.features) ? sub.features : [];
    return `
      <div class="max-w-3xl mx-auto space-y-5">
        <div class="glass-accent rounded-2xl p-6">
          <div class="flex flex-wrap justify-between gap-3 items-start">
            <div>
              <p class="text-xs text-cyan-400/80 uppercase tracking-wide mb-1">Active package</p>
              <h2 class="text-xl font-bold">${esc(sub.package_name)}</h2>
              <p class="text-sm text-slate-400 mt-1">KES ${Number(sub.price_kes || 0).toLocaleString()} / month</p>
            </div>
            ${statusChip(sub.status)}
          </div>
          <div class="grid grid-cols-2 gap-4 mt-6 text-sm">
            <div><span class="text-slate-500 text-xs">Start</span><div>${esc(sub.start_date)}</div></div>
            <div><span class="text-slate-500 text-xs">Renews / ends</span><div>${esc(sub.end_date)}</div></div>
            <div><span class="text-slate-500 text-xs">Payment ref</span><div class="font-mono text-xs">${esc(sub.payment_ref || '—')}</div></div>
            <div><span class="text-slate-500 text-xs">Code</span><div>${esc(sub.package_code)}</div></div>
          </div>
        </div>
        <div class="glass rounded-2xl p-6">
          <h3 class="font-semibold text-sm mb-4">Included coverage</h3>
          <ul class="space-y-2 text-sm text-slate-300">
            ${features.map(f => `<li class="flex gap-2"><i class="fas fa-check text-cyan-400 mt-0.5 text-xs"></i>${esc(f)}</li>`).join('')
              || '<li class="text-slate-500">Feature list will appear here.</li>'}
          </ul>
        </div>
      </div>`;
  }

  function renderSupport() {
    return `
      <div class="max-w-3xl mx-auto space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="font-semibold">Your tickets</h2>
          <button type="button" onclick="openTicketModal()" class="btn-g px-3 py-1.5 rounded-lg text-xs">New ticket</button>
        </div>
        ${state.tickets.length ? state.tickets.map(t => `
          <div class="glass rounded-xl p-4">
            <div class="flex flex-wrap justify-between gap-2 mb-2">
              <div>
                <span class="text-[10px] font-mono text-cyan-400">${esc(t.ticket_id)}</span>
                <div class="font-medium text-sm">${esc(t.subject)}</div>
              </div>
              <div class="flex gap-2 items-center">
                ${statusChip(t.priority)}
                ${statusChip(t.status)}
              </div>
            </div>
            <p class="text-sm text-slate-400 whitespace-pre-wrap">${esc(t.description)}</p>
            <p class="text-[10px] text-slate-600 mt-2">${esc(t.category || '')} · ${esc(t.created_at || '')}</p>
          </div>`).join('') : '<div class="glass rounded-xl p-8 text-center text-slate-500 text-sm">No support tickets yet.</div>'}
      </div>`;
  }

  function renderDocuments() {
    return `
      <div class="max-w-3xl mx-auto space-y-4">
        <h2 class="font-semibold">Reports & documents</h2>
        ${state.reports.length ? state.reports.map(r => `
          <div class="glass rounded-xl p-4 flex justify-between items-center gap-3">
            <div>
              <div class="font-medium text-sm">${esc(r.title)}</div>
              <div class="text-[10px] text-slate-500">${esc(r.report_type || '')} · ${esc(r.created_at || '')}</div>
            </div>
            ${r.file_url ? `<a href="${esc(r.file_url)}" target="_blank" rel="noopener" class="btn-ghost px-3 py-1.5 rounded-lg text-xs">Download</a>` : '<span class="text-xs text-slate-600">Pending</span>'}
          </div>`).join('') : `
          <div class="glass rounded-xl p-8 text-center text-slate-500 text-sm">
            No reports yet. Monthly and vulnerability reports will appear here when published by the team.
          </div>`}
      </div>`;
  }

  function renderBilling() {
    return `
      <div class="max-w-3xl mx-auto space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="font-semibold">Payment history</h2>
          <a href="packages.html" class="text-xs text-cyan-400 hover:underline">Renew / upgrade</a>
        </div>
        <div class="glass rounded-xl overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="text-slate-500 border-b border-slate-800 text-xs">
              <tr>
                <th class="p-3">Date</th>
                <th class="p-3">Package</th>
                <th class="p-3">Amount</th>
                <th class="p-3">Status</th>
                <th class="p-3">Receipt</th>
              </tr>
            </thead>
            <tbody>
              ${state.payments.length ? state.payments.map(p => `
                <tr class="border-b border-slate-800/50">
                  <td class="p-3 text-xs">${esc(p.created_at || '')}</td>
                  <td class="p-3">${esc(p.package_code || '')}</td>
                  <td class="p-3">KES ${Number(p.amount || 0).toLocaleString()}</td>
                  <td class="p-3">${statusChip(p.status)}</td>
                  <td class="p-3 font-mono text-xs">${esc(p.mpesa_receipt || '—')}</td>
                </tr>`).join('') : '<tr><td colspan="5" class="p-6 text-center text-slate-500">No payments yet.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  function renderProfile() {
    const u = state.user;
    return `
      <div class="max-w-md mx-auto glass rounded-2xl p-6 space-y-4">
        <div class="flex items-center gap-3">
          <div class="w-14 h-14 rounded-full bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-bold">${esc(initials(u.name))}</div>
          <div>
            <div class="font-bold">${esc(u.name)}</div>
            <div class="text-xs text-slate-500">${esc(u.role)}</div>
          </div>
        </div>
        <div class="text-sm space-y-3 pt-2">
          <div><span class="text-slate-500 text-xs">Email</span><div>${esc(u.email)}</div></div>
          <div><span class="text-slate-500 text-xs">Company</span><div>${esc(u.company || '—')}</div></div>
          <div><span class="text-slate-500 text-xs">Phone</span><div>${esc(u.phone || '—')}</div></div>
        </div>
        ${u.must_change_password ? '<p class="text-xs text-amber-300/90 bg-amber-500/10 border border-amber-500/20 rounded-lg p-3">Please change your temporary password. Contact support if you need a reset.</p>' : ''}
        <a href="https://wa.me/254768741052" target="_blank" rel="noopener" class="btn-ghost w-full py-2.5 rounded-xl text-sm text-center block">Contact support on WhatsApp</a>
      </div>`;
  }

  function openTicketModal() {
    document.getElementById('ticket-err').classList.add('hidden');
    document.getElementById('t-subject').value = '';
    document.getElementById('t-desc').value = '';
    const m = document.getElementById('ticket-modal');
    m.classList.remove('hidden');
    m.classList.add('flex');
  }
  function closeTicketModal() {
    const m = document.getElementById('ticket-modal');
    m.classList.add('hidden');
    m.classList.remove('flex');
  }

  async function submitTicket() {
    const subject = document.getElementById('t-subject').value.trim();
    const description = document.getElementById('t-desc').value.trim();
    const priority = document.getElementById('t-pri').value;
    const category = document.getElementById('t-cat').value;
    const err = document.getElementById('ticket-err');
    const btn = document.getElementById('t-submit');
    err.classList.add('hidden');

    if (!subject || !description) {
      err.textContent = 'Subject and details are required';
      err.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Sending...';
    try {
      await api('/api/me/tickets', {
        method: 'POST',
        body: JSON.stringify({ subject, description, priority, category })
      });
      closeTicketModal();
      await refreshData();
      go('support');
    } catch (e) {
      err.textContent = e.message || 'Could not create ticket';
      err.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit request';
    }
  }

  // expose for onclick handlers
  window.doLogin = doLogin;
  window.doLogout = doLogout;
  window.togglePw = togglePw;
  window.go = go;
  window.openTicketModal = openTicketModal;
  window.closeTicketModal = closeTicketModal;
  window.submitTicket = submitTicket;

  document.getElementById('ticket-modal').addEventListener('click', function (e) {
    if (e.target === this) closeTicketModal();
  });

  window.addEventListener('hashchange', () => {
    if (token()) go(location.hash.replace('#', '') || 'home');
  });

  // init
  if (token() && loadStoredUser()) {
    bootApp();
  }
})();
</script>
</body>
</html>
