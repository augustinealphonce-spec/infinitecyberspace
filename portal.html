<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Infinite Cyberspace Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
   <link rel="icon" type="image/png" href="infinite-cyberspace-favicon.png">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { void: { 950: '#050508', 900: '#0a0a10', 800: '#12121a' } }
        }
      }
    }
  </script>
  <style>
    body { background: #050508; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; }
    .glass {
      background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid rgba(148,163,184,0.1);
      backdrop-filter: blur(14px);
    }
    .glass-accent {
      background: linear-gradient(135deg, rgba(34,211,238,0.1), rgba(99,102,241,0.07));
      border: 1px solid rgba(34,211,238,0.2);
    }
    .btn-g {
      background: linear-gradient(135deg, #3b82f6, #22d3ee);
      color: #020617; font-weight: 700;
    }
    .btn-g:hover { filter: brightness(1.06); box-shadow: 0 8px 28px rgba(34,211,238,0.22); }
    .btn-ghost {
      border: 1px solid rgba(148,163,184,0.2);
      color: #cbd5e1;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.04); border-color: rgba(34,211,238,0.3); }
    .nav-i.active {
      background: linear-gradient(90deg, rgba(34,211,238,0.12), transparent);
      color: #22d3ee;
      border-left: 2px solid #22d3ee;
    }
    .grid-bg {
      background-image:
        linear-gradient(rgba(34,211,238,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .chip { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .s-ok { background: rgba(16,185,129,.18); color: #6ee7b7; }
    .s-open { background: rgba(59,130,246,.2); color: #93c5fd; }
    .s-warn { background: rgba(245,158,11,.2); color: #fcd34d; }
    .pulse { animation: p 2s ease-in-out infinite; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    .score-ring { background: conic-gradient(#22d3ee calc(var(--s) * 1%), #1e293b 0); }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    input, select, textarea { color-scheme: dark; }
  </style>
</head>
<body class="min-h-screen antialiased">

  <!-- LOGIN -->
  <div id="login-screen" class="min-h-screen grid-bg flex items-center justify-center p-4 relative">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(34,211,238,0.12),_transparent_55%)]"></div>
    <div class="relative z-10 w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex w-14 h-14 rounded-2xl glass-accent items-center justify-center mb-4">
          <i class="fas fa-shield-halved text-2xl text-cyan-400"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">Welcome back</h1>
        <p class="text-slate-500 text-sm mt-1">Sign in to your Infinite Cyberspace account</p>
      </div>
      <div class="glass rounded-3xl p-7 shadow-2xl">
        <div id="login-error" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/25 text-red-300 text-sm"></div>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Work email</label>
            <input id="login-email" type="email" placeholder="you@company.com" autocomplete="username"
              class="w-full px-4 py-3 rounded-xl bg-void-900 border border-slate-700/80 text-sm outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/20 transition">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
            <div class="relative">
              <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"
                class="w-full px-4 py-3 rounded-xl bg-void-900 border border-slate-700/80 text-sm outline-none focus:border-cyan-500/50 pr-11"
                onkeydown="if(event.key==='Enter')doLogin()">
              <button type="button" onclick="togglePw()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-sm" aria-label="Show password">
                <i id="pw-icon" class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="button" onclick="doLogin()" class="btn-g w-full py-3 rounded-xl text-sm mt-1">
            Sign in securely
          </button>
        </div>
        <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
          <p class="text-[11px] text-slate-500 leading-relaxed">
            Demo access<br>
            <span class="text-cyan-400/90">demo@client.com</span> · <span class="text-cyan-400/90">demo123</span>
          </p>
          <a href="index.html" class="inline-block mt-3 text-[11px] text-slate-600 hover:text-cyan-400 transition">← Back to website</a>
        </div>
      </div>
      <p class="text-center text-[10px] text-slate-600 mt-6">Protected connection · Kisumu, Kenya</p>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden min-h-screen flex">
    <aside id="sidebar" class="w-[240px] shrink-0 border-r border-slate-800/60 bg-void-900/95 flex flex-col fixed md:sticky top-0 h-screen z-40 -translate-x-full md:translate-x-0 transition-transform duration-200">
      <div class="p-4 border-b border-slate-800/60">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-cyan-500/15">
            <i class="fas fa-shield-halved text-void-950 text-sm"></i>
          </div>
          <div>
            <div class="font-bold text-sm tracking-tight">INFINITE<span class="text-cyan-400">CYBER</span></div>
            <div class="text-[10px] text-slate-500">Client account</div>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-2 space-y-0.5 overflow-y-auto text-[13px]">
        <button class="nav-i active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left" data-v="home" onclick="go('home')">
          <i class="fas fa-house w-5 text-center opacity-70"></i> Home
        </button>
        <button class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="protection" onclick="go('protection')">
          <i class="fas fa-shield-virus w-5 text-center opacity-70"></i> Protection
        </button>
        <button class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="support" onclick="go('support')">
          <i class="fas fa-headset w-5 text-center opacity-70"></i> Support
          <span id="badge-tickets" class="ml-auto chip s-open hidden">0</span>
        </button>
        <button class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="documents" onclick="go('documents')">
          <i class="fas fa-folder-open w-5 text-center opacity-70"></i> Documents
        </button>
        <button class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="billing" onclick="go('billing')">
          <i class="fas fa-receipt w-5 text-center opacity-70"></i> Billing
        </button>
        <button class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="learn" onclick="go('learn')">
          <i class="fas fa-book-open w-5 text-center opacity-70"></i> Learn
        </button>
        <div class="pt-3 mt-2 border-t border-slate-800/60">
          <button class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="profile" onclick="go('profile')">
            <i class="fas fa-user w-5 text-center opacity-70"></i> Profile
          </button>
          <button class="nav-i w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-slate-400 hover:bg-white/[0.03]" data-v="settings" onclick="go('settings')">
            <i class="fas fa-gear w-5 text-center opacity-70"></i> Settings
          </button>
        </div>
      </nav>
      <div class="p-3 border-t border-slate-800/60">
        <div class="flex items-center gap-2.5 mb-2">
          <img id="side-av" src="" alt="" class="w-9 h-9 rounded-full object-cover border border-cyan-500/30">
          <div class="min-w-0 flex-1">
            <div id="side-name" class="text-xs font-semibold truncate"></div>
            <div id="side-co" class="text-[10px] text-slate-500 truncate"></div>
          </div>
        </div>
        <button onclick="doLogout()" class="w-full text-[11px] text-slate-500 hover:text-red-400 py-1.5 rounded-lg hover:bg-red-500/5 transition">
          Sign out
        </button>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="sticky top-0 z-30 h-14 border-b border-slate-800/60 bg-void-950/85 backdrop-blur-xl px-4 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button type="button" class="md:hidden p-2 rounded-lg text-slate-400 hover:bg-white/5" onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" aria-label="Menu">
            <i class="fas fa-bars"></i>
          </button>
          <div class="min-w-0">
            <h1 id="page-title" class="text-sm font-semibold truncate">Home</h1>
            <p id="page-sub" class="text-[10px] text-slate-500 truncate">Your security at a glance</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-[10px] text-emerald-400 font-medium">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse"></span> Protected
          </div>
          <button type="button" onclick="go('support'); setTimeout(openTicketModal, 100)" class="btn-g hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs">
            <i class="fas fa-plus text-[10px]"></i> Get help
          </button>
          <button type="button" onclick="go('profile')" class="p-0.5 rounded-full hover:ring-2 hover:ring-cyan-500/30 transition">
            <img id="hdr-av" src="" alt="" class="w-8 h-8 rounded-full object-cover">
          </button>
        </div>
      </header>

      <main id="main" class="flex-1 overflow-y-auto p-4 md:p-6 grid-bg"></main>
    </div>
  </div>

  <!-- Ticket modal -->
  <div id="ticket-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
    <div class="glass rounded-2xl w-full max-w-md p-6 border border-cyan-500/15 shadow-2xl">
      <div class="flex justify-between items-center mb-5">
        <div>
          <h3 class="font-semibold">Request support</h3>
          <p class="text-[11px] text-slate-500 mt-0.5">We typically respond within 2 hours</p>
        </div>
        <button type="button" onclick="closeTicketModal()" class="text-slate-400 hover:text-white text-xl leading-none" aria-label="Close">&times;</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-[11px] text-slate-500 mb-1 block">What do you need help with?</label>
          <input id="t-subject" type="text" placeholder="Short summary"
            class="w-full px-3.5 py-2.5 rounded-xl bg-void-900 border border-slate-700 text-sm outline-none focus:border-cyan-500/40">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[11px] text-slate-500 mb-1 block">Category</label>
            <select id="t-cat" class="w-full px-3 py-2.5 rounded-xl bg-void-900 border border-slate-700 text-sm">
              <option>Security incident</option>
              <option>Device / endpoint</option>
              <option>Email or phishing</option>
              <option>Network / VPN</option>
              <option>Account or billing</option>
              <option>General question</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] text-slate-500 mb-1 block">Urgency</label>
            <select id="t-pri" class="w-full px-3 py-2.5 rounded-xl bg-void-900 border border-slate-700 text-sm">
              <option value="Low">Low — can wait</option>
              <option value="Medium" selected>Medium — soon</option>
              <option value="High">High — urgent</option>
              <option value="Critical">Critical — outage / breach</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-[11px] text-slate-500 mb-1 block">Details</label>
          <textarea id="t-desc" rows="4" placeholder="What happened? When? Any error messages?"
            class="w-full px-3.5 py-2.5 rounded-xl bg-void-900 border border-slate-700 text-sm outline-none focus:border-cyan-500/40 resize-none"></textarea>
        </div>
        <button type="button" onclick="submitTicket()" class="btn-g w-full py-3 rounded-xl text-sm">Submit request</button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 z-[60] hidden max-w-sm px-4 py-3 rounded-xl bg-void-800 border border-cyan-500/25 text-sm shadow-xl"></div>

<script>
const AVATAR = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e7490"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs><rect fill="url(#g)" width="128" height="128"/><circle cx="64" cy="48" r="26" fill="#a5f3fc"/><ellipse cx="64" cy="118" rx="44" ry="36" fill="#a5f3fc"/></svg>'
);

const SERVICES = [
  { name: '24/7 threat monitoring', desc: 'Continuous watch on your environment', icon: 'fa-radar', on: true },
  { name: 'Endpoint protection', desc: 'Laptops, servers & workstations', icon: 'fa-laptop', on: true },
  { name: 'Email security', desc: 'Phishing & malware filtering', icon: 'fa-envelope-circle-check', on: true },
  { name: 'Vulnerability scans', desc: 'Scheduled findings & fixes', icon: 'fa-magnifying-glass-chart', on: true },
  { name: 'Monthly reports', desc: 'Clear status for leadership', icon: 'fa-file-lines', on: true },
  { name: 'Staff training', desc: 'Awareness & simulations', icon: 'fa-graduation-cap', on: true }
];

const DOCS = [
  { name: 'Security report — July 2026', date: '1 Aug 2026', type: 'PDF', tag: 'Report' },
  { name: 'Vulnerability scan results', date: '20 Jul 2026', type: 'PDF', tag: 'Scan' },
  { name: 'Training certificates', date: '10 Jul 2026', type: 'PDF', tag: 'Training' },
  { name: 'Service agreement', date: '15 Jul 2026', type: 'PDF', tag: 'Contract' }
];

const INVOICES = [
  { id: 'INV-2026-008', date: '1 Aug 2026', amount: 38900, status: 'Paid' },
  { id: 'INV-2026-007', date: '1 Jul 2026', amount: 38900, status: 'Paid' },
  { id: 'INV-2026-006', date: '1 Jun 2026', amount: 38900, status: 'Paid' }
];

const LEARN = [
  { title: 'Spot a phishing email', time: '3 min', cat: 'Awareness', icon: 'fa-fish' },
  { title: 'Strong passwords & MFA', time: '4 min', cat: 'Identity', icon: 'fa-key' },
  { title: 'If you suspect a breach', time: '5 min', cat: 'Incident', icon: 'fa-triangle-exclamation' },
  { title: 'Secure remote work', time: '4 min', cat: 'Endpoint', icon: 'fa-house-laptop' },
  { title: 'Reading your monthly report', time: '3 min', cat: 'Reports', icon: 'fa-chart-simple' },
  { title: 'How support SLAs work', time: '2 min', cat: 'Support', icon: 'fa-clock' }
];

const ACTIVITY = [
  { text: 'Full environment scan completed', meta: 'No critical findings', time: '2 hours ago', icon: 'fa-check', color: 'text-emerald-400' },
  { text: '14 phishing attempts blocked', meta: 'Email gateway', time: 'Yesterday', icon: 'fa-ban', color: 'text-cyan-400' },
  { text: 'July security report published', meta: 'Ready to download', time: '1 Aug', icon: 'fa-file-pdf', color: 'text-blue-400' },
  { text: 'Premium plan renewed', meta: 'Next billing 15 Aug', time: '15 Jul', icon: 'fa-rotate', color: 'text-violet-400' }
];

let tickets = [];
let profile = null;

function togglePw() {
  const i = document.getElementById('login-password');
  const icon = document.getElementById('pw-icon');
  if (i.type === 'password') { i.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { i.type = 'password'; icon.className = 'fas fa-eye'; }
}

function doLogin() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.classList.add('hidden');

  if (email === 'demo@client.com' && password === 'demo123') {
    profile = JSON.parse(localStorage.getItem('ich_client_profile') || 'null') || {
      name: 'John Odhiambo',
      email: 'demo@client.com',
      company: 'Acme Solutions Ltd',
      phone: '+254 712 345 678',
      title: 'IT Manager',
      avatar: AVATAR
    };
    localStorage.setItem('ich_client_profile', JSON.stringify(profile));
    localStorage.setItem('ich_client_in', '1');
    boot();
    return;
  }
  err.textContent = 'Incorrect email or password. Try the demo credentials below.';
  err.classList.remove('hidden');
}

function doLogout() {
  localStorage.removeItem('ich_client_in');
  location.reload();
}

function boot() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  applyProfile();
  loadTickets();
  go('home');
}

function applyProfile() {
  const av = profile.avatar || AVATAR;
  document.getElementById('side-av').src = av;
  document.getElementById('hdr-av').src = av;
  document.getElementById('side-name').textContent = profile.name;
  document.getElementById('side-co').textContent = profile.company;
}

function loadTickets() {
  const shared = JSON.parse(localStorage.getItem('ich_shared_tickets') || '[]');
  const email = (profile.email || '').toLowerCase();
  tickets = shared.filter(t =>
    (t.email || '').toLowerCase() === email ||
    (t.customer || '').includes(profile.name || '') ||
    t.source === 'client_portal'
  );
  if (!tickets.length) {
    tickets = JSON.parse(localStorage.getItem('ich_client_tickets') || '[]');
  }
  const open = tickets.filter(t => t.status !== 'Closed' && t.status !== 'Resolved').length;
  const badge = document.getElementById('badge-tickets');
  if (open) { badge.textContent = open; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

const TITLES = {
  home: ['Home', 'Your security at a glance'],
  protection: ['Protection', 'Services included in your plan'],
  support: ['Support', 'Talk to our security team'],
  documents: ['Documents', 'Reports and files'],
  billing: ['Billing', 'Plan and invoices'],
  learn: ['Learn', 'Short guides for your team'],
  profile: ['Profile', 'Your account details'],
  settings: ['Settings', 'Preferences and security']
};

function go(v) {
  loadTickets();
  document.querySelectorAll('.nav-i').forEach(b => {
    const on = b.dataset.v === v;
    b.classList.toggle('active', on);
    b.classList.toggle('text-slate-400', !on);
  });
  document.getElementById('page-title').textContent = TITLES[v][0];
  document.getElementById('page-sub').textContent = TITLES[v][1];
  document.getElementById('sidebar').classList.add('-translate-x-full');
  document.getElementById('main').innerHTML = render[v]();
  if (v === 'profile') fillProfileForm();
}

const render = {};

render.home = () => {
  const first = (profile.name || 'there').split(' ')[0];
  const open = tickets.filter(t => !['Closed','Resolved'].includes(t.status)).length;
  return `
  <div class="mb-6">
    <h2 class="text-xl md:text-2xl font-bold tracking-tight">Good to see you, ${esc(first)}</h2>
    <p class="text-slate-500 text-sm mt-1">Here’s what’s happening with ${esc(profile.company || 'your account')}.</p>
  </div>

  <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-3 mb-6">
    <div class="glass-accent rounded-2xl p-5">
      <div class="flex items-center gap-3">
        <div class="score-ring w-12 h-12 rounded-full p-[3px] shrink-0" style="--s:87">
          <div class="w-full h-full rounded-full bg-void-950 flex items-center justify-center text-xs font-bold text-cyan-400">87</div>
        </div>
        <div>
          <div class="text-[10px] uppercase tracking-wide text-slate-500">Security score</div>
          <div class="font-semibold text-lg">Good</div>
        </div>
      </div>
    </div>
    <div class="glass rounded-2xl p-5">
      <div class="text-[10px] uppercase tracking-wide text-slate-500 mb-1">Your plan</div>
      <div class="font-semibold text-cyan-300">Premium</div>
      <div class="text-[11px] text-slate-500 mt-1">Renews 15 Aug 2026</div>
    </div>
    <div class="glass rounded-2xl p-5">
      <div class="text-[10px] uppercase tracking-wide text-slate-500 mb-1">Open requests</div>
      <div class="font-semibold text-2xl">${open}</div>
      <button onclick="go('support')" class="text-[11px] text-cyan-400 hover:underline mt-1">View support →</button>
    </div>
    <div class="glass rounded-2xl p-5">
      <div class="text-[10px] uppercase tracking-wide text-slate-500 mb-1">Threats blocked</div>
      <div class="font-semibold text-2xl text-emerald-400">1,248</div>
      <div class="text-[11px] text-slate-500 mt-1">Last 30 days</div>
    </div>
  </div>

  <div class="grid lg:grid-cols-5 gap-4 mb-6">
    <div class="lg:col-span-3 glass rounded-2xl p-5">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-semibold text-sm">What’s active</h3>
        <button onclick="go('protection')" class="text-[11px] text-cyan-400 hover:underline">All services</button>
      </div>
      <div class="grid sm:grid-cols-2 gap-2">
        ${SERVICES.slice(0,4).map(s => `
          <div class="flex items-center gap-3 p-3 rounded-xl bg-void-900/50 border border-slate-800/60">

function ticketCards() {
  if (!tickets.length) {
    return `<div class="glass rounded-2xl p-10 text-center">
      <div class="w-12 h-12 rounded-2xl bg-slate-800/80 flex items-center justify-center mx-auto mb-3 text-slate-500"><i class="fas fa-inbox text-lg"></i></div>
      <p class="text-sm text-slate-400 mb-1">No support requests yet</p>
      <p class="text-[12px] text-slate-600 mb-4">When something needs attention, start here.</p>
      <button onclick="openTicketModal()" class="btn-g px-4 py-2 rounded-xl text-xs">Create first request</button>
    </div>`;
  }
  return tickets.map(t => `
    <div class="glass rounded-2xl p-4 sm:p-5">
      <div class="flex flex-wrap items-center gap-2 mb-2">
        <span class="chip s-open">${esc(t.status || 'Open')}</span>
        <span class="chip s-warn">${esc(t.priority || 'Medium')}</span>
        <span class="text-[10px] text-slate-600 font-mono">${esc(t.id)}</span>
      </div>
      <div class="font-medium text-sm">${esc(t.subject)}</div>
      <p class="text-[12px] text-slate-500 mt-1 line-clamp-2">${esc(t.description || '')}</p>
      <div class="text-[11px] text-slate-600 mt-2">${esc(t.category || t.cat || '')} · ${esc(t.date || '')}</div>
    </div>`).join('');
}

function fillProfileForm() {
  document.getElementById('prof-av').src = profile.avatar || AVATAR;
  document.getElementById('prof-label-name').textContent = profile.name;
  document.getElementById('prof-label-title').textContent = profile.title || 'Client';
  document.getElementById('prof-label-co').textContent = profile.company;
  document.getElementById('p-name').value = profile.name || '';
  document.getElementById('p-email').value = profile.email || '';
  document.getElementById('p-co').value = profile.company || '';
  document.getElementById('p-phone').value = profile.phone || '';
  document.getElementById('p-title').value = profile.title || '';
}

      <input type="password" placeholder="New password" class="w-full px-3.5 py-2.5 rounded-xl bg-void-900 border border-slate-700 text-sm outline-none focus:border-cyan-500/40">
      <button type="button" onclick="toast('Password updated (demo)')" class="btn-g px-4 py-2 rounded-xl text-xs">Update password</button>

function changePhoto(e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    profile.avatar = r.result;
    localStorage.setItem('ich_client_profile', JSON.stringify(profile));
    applyProfile();
    fillProfileForm();
    toast('Photo updated');
  };
  r.readAsDataURL(f);
}

function saveProfile() {
  profile.name = document.getElementById('p-name').value.trim();
  profile.company = document.getElementById('p-co').value.trim();
  profile.phone = document.getElementById('p-phone').value.trim();
  profile.title = document.getElementById('p-title').value.trim();
  localStorage.setItem('ich_client_profile', JSON.stringify(profile));
  applyProfile();
  fillProfileForm();
  toast('Profile saved');
}

function openTicketModal() {
  document.getElementById('ticket-modal').classList.remove('hidden');
  document.getElementById('ticket-modal').classList.add('flex');
}
function closeTicketModal() {
  document.getElementById('ticket-modal').classList.add('hidden');
  document.getElementById('ticket-modal').classList.remove('flex');
}

function submitTicket() {
  const subject = document.getElementById('t-subject').value.trim();
  const description = document.getElementById('t-desc').value.trim();
  const priority = document.getElementById('t-pri').value;
  const category = document.getElementById('t-cat').value;
  if (!subject || !description) {
    toast('Please add a summary and details');
    return;
  }
  const ticket = {
    id: 'TKT-' + Date.now().toString().slice(-6),
    subject, description, priority, category,
    status: 'Open',
    date: new Date().toLocaleString(),
    customer: profile.name,
    company: profile.company,
    email: profile.email,
    createdMinutesAgo: 0,
    source: 'client_portal'
  };
  tickets.unshift(ticket);
  localStorage.setItem('ich_client_tickets', JSON.stringify(tickets));
  const shared = JSON.parse(localStorage.getItem('ich_shared_tickets') || '[]');
  shared.unshift(ticket);
  localStorage.setItem('ich_shared_tickets', JSON.stringify(shared));
  closeTicketModal();
  document.getElementById('t-subject').value = '';
  document.getElementById('t-desc').value = '';
  toast('Request sent — we usually reply within 2 hours');
  go('support');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2800);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('ich_client_in') === '1') {
    profile = JSON.parse(localStorage.getItem('ich_client_profile') || '{}');
    if (profile.email) boot();
  }
});
</script>
