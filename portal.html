<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal | Infinite Cyberspace Hub</title>
  <script src="auth.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root { --primary: #22d3ee; --dark: #0a0a0a; }
    body { background: var(--dark); color: #e2e8f0; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(34,211,238,0.15); border-radius: 1rem; }
    .btn-primary { background: linear-gradient(90deg,#3b82f6,#22d3ee); color: #000; font-weight: 700; }
    .status-active { background: rgba(16,185,129,0.2); color: #34d399; }
    .status-pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
    .status-open { background: rgba(59,130,246,0.2); color: #93c5fd; }
  </style>
  <!-- Security Headers via Meta Tags -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://splitforms.com;
  style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
  img-src 'self' data: https: blob:;
  connect-src 'self' https://splitforms.com;
  frame-ancestors 'none';
  base-uri 'self';
  form-action 'self' https://splitforms.com;
">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Frame-Options" content="DENY">
</head>
<body class="min-h-screen">

  <!-- LOGIN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="card p-8 w-full max-w-md">
      <h1 class="text-2xl font-bold text-cyan-400 mb-2 text-center">Customer Portal</h1>
      <p class="text-center text-slate-400 mb-8">Infinite Cyberspace Hub</p>
      
      <div id="login-error" class="hidden mb-4 p-3 bg-red-900/40 text-red-300 rounded-lg text-sm"></div>
      
      <input id="login-email" type="email" placeholder="Email address" 
             class="w-full mb-4 px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 outline-none focus:border-cyan-400">
      <input id="login-password" type="password" placeholder="Password" 
             class="w-full mb-6 px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 outline-none focus:border-cyan-400">
      
      <button onclick="login()" class="btn-primary w-full py-3 rounded-xl">Login</button>
      
      <p class="text-center text-sm text-slate-500 mt-6">
        Demo Login:<br>
        Email: <span class="text-cyan-400">demo@client.com</span><br>
        Password: <span class="text-cyan-400">demo123</span>
      </p>
    </div>
  </div>

  <!-- PORTAL -->
  <div id="portal" class="hidden">
    <nav class="border-b border-cyan-500/20 bg-black/60 backdrop-blur sticky top-0 z-50">
      <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <span class="text-xl font-bold text-cyan-400">INFINITE<span class="text-white">CYBER</span> 
          <span class="text-xs bg-cyan-900/50 text-cyan-300 px-2 py-1 rounded ml-2">PORTAL</span>
        </span>
        <div class="flex items-center gap-4">
          <span id="user-name" class="text-sm text-slate-400"></span>
          <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">

      <!-- Package Card -->
      <div class="card p-6 mb-8">
        <div class="flex flex-col md:flex-row justify-between gap-4 items-start">
          <div>
            <h2 class="text-2xl font-bold" id="pkg-name">—</h2>
            <p class="text-slate-400 mt-1" id="pkg-period"></p>
            <p class="text-sm text-slate-500 mt-2" id="pkg-amount"></p>
          </div>
          <div>
            <span id="pkg-status" class="px-4 py-1.5 rounded-full text-sm font-medium"></span>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="grid md:grid-cols-4 gap-4 mb-10">
        <button onclick="showTab('overview')" class="card p-5 text-left hover:border-cyan-400 transition">
          <i class="fas fa-home text-cyan-400 text-xl mb-2"></i>
          <div class="font-medium">Overview</div>
        </button>
        <button onclick="showTab('tickets')" class="card p-5 text-left hover:border-cyan-400 transition">
          <i class="fas fa-headset text-cyan-400 text-xl mb-2"></i>
          <div class="font-medium">Support Tickets</div>
        </button>
        <button onclick="showTab('invoices')" class="card p-5 text-left hover:border-cyan-400 transition">
          <i class="fas fa-file-invoice text-cyan-400 text-xl mb-2"></i>
          <div class="font-medium">Invoices</div>
        </button>
        <button onclick="showTab('reports')" class="card p-5 text-left hover:border-cyan-400 transition">
          <i class="fas fa-file-alt text-cyan-400 text-xl mb-2"></i>
          <div class="font-medium">Reports</div>
        </button>
      </div>

      <!-- OVERVIEW -->
      <div id="panel-overview" class="card p-6">
        <h3 class="text-lg font-semibold mb-4">Your Active Services</h3>
        <div id="services-list" class="grid md:grid-cols-2 gap-4"></div>
      </div>

      <!-- TICKETS -->
      <div id="panel-tickets" class="hidden">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-semibold">Support Tickets</h3>
          <button onclick="openTicketModal()" class="btn-primary px-5 py-2 rounded-xl text-sm">
            <i class="fas fa-plus"></i> New Ticket
          </button>
        </div>
        <div id="tickets-list" class="space-y-3"></div>
      </div>

      <!-- INVOICES -->
      <div id="panel-invoices" class="hidden card p-6">
        <h3 class="text-lg font-semibold mb-4">Invoices & Payments</h3>
        <div id="invoices-list"></div>
      </div>

      <!-- REPORTS -->
      <div id="panel-reports" class="hidden card p-6">
        <h3 class="text-lg font-semibold mb-4">Downloadable Reports</h3>
        <div id="reports-list" class="space-y-3"></div>
      </div>

    </div>
  </div>

  <!-- NEW TICKET MODAL -->
  <div id="ticket-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
    <div class="card w-full max-w-lg p-6">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-lg font-semibold">Create Support Ticket</h3>
        <button onclick="closeTicketModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Subject</label>
          <input id="ticket-subject" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Description</label>
          <textarea id="ticket-description" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:border-cyan-400"></textarea>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Priority</label>
          <select id="ticket-priority" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <button onclick="createTicket()" class="btn-primary w-full py-3 rounded-xl">Submit Ticket</button>
      </div>
    </div>
  </div>

<script>
  // ===================== DEMO DATA =====================
  const demoUser = {
    name: "John Odhiambo",
    email: "demo@client.com",
    company: "Acme Solutions Ltd",
    phone: "+254712345678"
  };

  const demoSubscription = {
    package_name: "Premium Protection",
    amount: 38900,
    status: "active",
    start_date: "2026-07-15",
    end_date: "2026-08-15"
  };

  let clientTickets = JSON.parse(localStorage.getItem('client_tickets') || '[]');
  // Load tickets created by customers
const savedClientTickets = JSON.parse(localStorage.getItem('admin_tickets') || '[]');
if (savedClientTickets.length > 0) {
  // Merge without duplicates
  savedClientTickets.forEach(ct => {
    if (!tickets.find(t => t.id === ct.id)) {
      tickets.unshift({
        id: ct.id,
        subject: ct.subject,
        customer: ct.customer + " (" + ct.company + ")",
        priority: ct.priority,
        status: ct.status,
        createdMinutesAgo: 5
      });
    }
  });
}
  let clientInvoices = [
    { id: "INV-001", date: "2026-07-15", amount: 38900, status: "Paid", description: "Premium Protection - July" },
    { id: "INV-002", date: "2026-08-01", amount: 38900, status: "Paid", description: "Premium Protection - August" }
  ];

  let clientReports = [
    { name: "Monthly Security Report - July 2026", date: "2026-08-01", type: "PDF" },
    { name: "Vulnerability Scan Results", date: "2026-07-20", type: "PDF" },
    { name: "Employee Training Certificate", date: "2026-07-10", type: "PDF" }
  ];

  // ===================== LOGIN =====================
async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');

  const result = await login(email, password);   // from auth.js

  if (result.success) {
    if (result.user.role === 'client') {
      showPortal();
    } else if (result.user.role === 'admin') {
      window.location.href = 'admin.html';
    }
  } else {
    errorEl.textContent = result.message;
    errorEl.classList.remove('hidden');
  }
}

  function logout() {
    localStorage.removeItem('customer_logged_in');
    location.reload();
  }

  function showPortal() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('portal').classList.remove('hidden');

    document.getElementById('user-name').textContent = demoUser.name;
    document.getElementById('pkg-name').textContent = demoSubscription.package_name;
    document.getElementById('pkg-period').textContent = `Valid from ${demoSubscription.start_date} to ${demoSubscription.end_date}`;
    document.getElementById('pkg-amount').textContent = `KES ${demoSubscription.amount.toLocaleString()} / month`;

    const st = document.getElementById('pkg-status');
    st.textContent = "ACTIVE";
    st.className = "px-4 py-1.5 rounded-full text-sm font-medium status-active";

    renderServices();
    renderTickets();
    renderInvoices();
    renderReports();
  }

  // ===================== RENDER FUNCTIONS =====================
  function renderServices() {
    const services = [
      "24/7 Threat Monitoring",
      "Endpoint Protection",
      "Email & Phishing Protection",
      "Monthly Security Reports",
      "Priority Support",
      "Employee Training Access"
    ];
    document.getElementById('services-list').innerHTML = services.map(s => `
      <div class="card p-4 flex justify-between items-center">
        <span>${s}</span>
        <span class="text-xs px-2 py-1 rounded status-active">Active</span>
      </div>
    `).join('');
  }

  function renderTickets() {
    const list = document.getElementById('tickets-list');
    if (clientTickets.length === 0) {
      list.innerHTML = `<p class="text-slate-500">No tickets yet. Create your first support ticket.</p>`;
      return;
    }
    list.innerHTML = clientTickets.map(t => `
      <div class="card p-4 flex justify-between items-start">
        <div>
          <div class="font-medium">${t.subject}</div>
          <div class="text-sm text-slate-400 mt-1">${t.description.substring(0, 80)}...</div>
          <div class="text-xs text-slate-500 mt-2">${t.date} • Priority: ${t.priority}</div>
        </div>
        <span class="badge status-open text-xs px-2 py-1 rounded">${t.status}</span>
      </div>
    `).join('');
  }

  function renderInvoices() {
    document.getElementById('invoices-list').innerHTML = `
      <table class="w-full text-sm">
        <thead class="text-slate-400">
          <tr>
            <th class="text-left pb-3">Invoice</th>
            <th class="text-left pb-3">Date</th>
            <th class="text-left pb-3">Amount</th>
            <th class="text-left pb-3">Status</th>
            <th class="text-left pb-3">Action</th>
          </tr>
        </thead>
        <tbody>
          ${clientInvoices.map(inv => `
            <tr class="border-t border-slate-800">
              <td class="py-3 font-medium">${inv.id}</td>
              <td class="py-3 text-slate-400">${inv.date}</td>
              <td class="py-3 text-emerald-400">KES ${inv.amount.toLocaleString()}</td>
              <td class="py-3"><span class="status-active text-xs px-2 py-1 rounded">${inv.status}</span></td>
              <td class="py-3"><button onclick="alert('Downloading ${inv.id}')" class="text-cyan-400 text-xs hover:underline">Download</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function renderReports() {
    document.getElementById('reports-list').innerHTML = clientReports.map(r => `
      <div class="flex justify-between items-center p-4 rounded-lg bg-slate-900/50">
        <div>
          <div class="font-medium">${r.name}</div>
          <div class="text-xs text-slate-500">${r.date} • ${r.type}</div>
        </div>
        <button onclick="alert('Downloading: ${r.name}')" class="btn-primary px-4 py-2 rounded-lg text-sm">
          <i class="fas fa-download"></i> Download
        </button>
      </div>
    `).join('');
  }

  // ===================== TICKETS =====================
  function openTicketModal() {
    document.getElementById('ticket-modal').classList.remove('hidden');
    document.getElementById('ticket-modal').classList.add('flex');
  }
  function closeTicketModal() {
    document.getElementById('ticket-modal').classList.add('hidden');
    document.getElementById('ticket-modal').classList.remove('flex');
  }

async function createTicket() {
  const subject = document.getElementById('ticket-subject').value.trim();
  const description = document.getElementById('ticket-description').value.trim();
  const priority = document.getElementById('ticket-priority').value;

  if (!subject || !description) {
    alert('Please fill in subject and description');
    return;
  }

  try {
    const res = await fetch('http://localhost:3000/api/tickets', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ subject, description, priority })
    });

    const data = await res.json();

    if (res.ok) {
      closeTicketModal();
      document.getElementById('ticket-subject').value = '';
      document.getElementById('ticket-description').value = '';
      loadTickets();          // refresh the list
      alert('Ticket created successfully!');
    } else {
      alert(data.message || 'Failed to create ticket');
    }
  } catch (err) {
    alert('Cannot connect to server. Is the backend running?');
  }
}

    const newTicket = {
      id: "TKT-" + Date.now().toString().slice(-6),
      subject,
      description,
      priority,
      status: "Open",
      date: new Date().toLocaleString(),
      customer: demoUser.name,
      company: demoUser.company
    };

    clientTickets.unshift(newTicket);
    localStorage.setItem('client_tickets', JSON.stringify(clientTickets));

    // Also save to admin side
    let adminTickets = JSON.parse(localStorage.getItem('admin_tickets') || '[]');
    adminTickets.unshift(newTicket);
    localStorage.setItem('admin_tickets', JSON.stringify(adminTickets));

    closeTicketModal();
    document.getElementById('ticket-subject').value = '';
    document.getElementById('ticket-description').value = '';
    renderTickets();
    alert("Ticket submitted successfully! Our team will respond soon.");
  }

  function showTab(name) {
    ['overview', 'tickets', 'invoices', 'reports'].forEach(t => {
      document.getElementById(`panel-${t}`).classList.add('hidden');
    });
    document.getElementById(`panel-${name}`).classList.remove('hidden');
  }

  // Auto login if already logged in
  if (localStorage.getItem('customer_logged_in') === 'true') {
    showPortal();
  }
  // Protect the portal
document.addEventListener('DOMContentLoaded', () => {
  if (isLoggedIn() && getCurrentUser().role === 'client') {
    showPortal();
  }
});
</script>
</body>
</html>
