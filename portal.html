<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal | Infinite Cyberspace Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root { --primary: #22d3ee; --dark: #0a0a0a; }
    body { background: var(--dark); color: #e2e8f0; font-family: system-ui, sans-serif; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(34,211,238,0.15); border-radius: 1rem; }
    .btn-primary { background: linear-gradient(90deg,#3b82f6,#22d3ee); color: #000; font-weight: 700; }
    .status-active { background: rgba(16,185,129,0.2); color: #34d399; }
    .status-open { background: rgba(59,130,246,0.2); color: #93c5fd; }
  </style>
</head>
<body class="min-h-screen">

  <!-- LOGIN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="card p-8 w-full max-w-md">
      <h1 class="text-2xl font-bold text-cyan-400 mb-2 text-center">Customer Portal</h1>
      <p class="text-center text-slate-400 mb-8">Infinite Cyberspace Hub</p>

      <div id="login-error" class="hidden mb-4 p-3 bg-red-900/40 text-red-300 rounded-lg text-sm"></div>

      <input id="login-email" type="email" placeholder="Email address"
             class="w-full mb-4 px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 outline-none focus:border-cyan-400 text-white">
      <input id="login-password" type="password" placeholder="Password"
             class="w-full mb-6 px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 outline-none focus:border-cyan-400 text-white"
             onkeydown="if(event.key==='Enter')handleLogin()">

      <button type="button" onclick="handleLogin()" class="btn-primary w-full py-3 rounded-xl">Login</button>

      <p class="text-center text-sm text-slate-500 mt-6">
        Demo Login:<br>
        Email: <span class="text-cyan-400">demo@client.com</span><br>
        Password: <span class="text-cyan-400">demo123</span>
      </p>
    </div>
  </div>

  <!-- PORTAL -->
  <div id="portal" class="hidden">
    <nav class="border-b border-cyan-500/20 bg-black/60 backdrop-blur sticky top-0 z-50">
      <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <span class="text-xl font-bold text-cyan-400">INFINITE<span class="text-white">CYBER</span>
          <span class="text-xs bg-cyan-900/50 text-cyan-300 px-2 py-1 rounded ml-2">PORTAL</span>
        </span>
        <div class="flex items-center gap-4">
          <span id="user-name" class="text-sm text-slate-400"></span>
          <button type="button" onclick="doLogout()" class="text-sm text-red-400 hover:text-red-300">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
      <div class="card p-6 mb-8">
        <div class="flex flex-col md:flex-row justify-between gap-4 items-start">
          <div>
            <h2 class="text-2xl font-bold" id="pkg-name">—</h2>
            <p class="text-slate-400 mt-1" id="pkg-period"></p>
            <p class="text-sm text-slate-500 mt-2" id="pkg-amount"></p>
          </div>
          <span id="pkg-status" class="px-4 py-1.5 rounded-full text-sm font-medium"></span>
        </div>
      </div>

      <div class="grid md:grid-cols-4 gap-4 mb-10">
        <button type="button" onclick="showTab('overview')" class="card p-5 text-left hover:border-cyan-400 transition border border-transparent">
          <i class="fas fa-home text-cyan-400 text-xl mb-2"></i>
          <div class="font-medium">Overview</div>
        </button>
        <button type="button" onclick="showTab('tickets')" class="card p-5 text-left hover:border-cyan-400 transition border border-transparent">
          <i class="fas fa-headset text-cyan-400 text-xl mb-2"></i>
          <div class="font-medium">Support Tickets</div>
        </button>
        <button type="button" onclick="showTab('invoices')" class="card p-5 text-left hover:border-cyan-400 transition border border-transparent">
          <i class="fas fa-file-invoice text-cyan-400 text-xl mb-2"></i>
          <div class="font-medium">Invoices</div>
        </button>
        <button type="button" onclick="showTab('reports')" class="card p-5 text-left hover:border-cyan-400 transition border border-transparent">
          <i class="fas fa-file-alt text-cyan-400 text-xl mb-2"></i>
          <div class="font-medium">Reports</div>
        </button>
      </div>

      <div id="panel-overview" class="card p-6">
        <h3 class="text-lg font-semibold mb-4">Your Active Services</h3>
        <div id="services-list" class="grid md:grid-cols-2 gap-4"></div>
      </div>

      <div id="panel-tickets" class="hidden">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-semibold">Support Tickets</h3>
          <button type="button" onclick="openTicketModal()" class="btn-primary px-5 py-2 rounded-xl text-sm">
            <i class="fas fa-plus"></i> New Ticket
          </button>
        </div>
        <div id="tickets-list" class="space-y-3"></div>
      </div>

      <div id="panel-invoices" class="hidden card p-6">
        <h3 class="text-lg font-semibold mb-4">Invoices & Payments</h3>
        <div id="invoices-list"></div>
      </div>

      <div id="panel-reports" class="hidden card p-6">
        <h3 class="text-lg font-semibold mb-4">Downloadable Reports</h3>
        <div id="reports-list" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <!-- TICKET MODAL -->
  <div id="ticket-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
    <div class="card w-full max-w-lg p-6">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-lg font-semibold">Create Support Ticket</h3>
        <button type="button" onclick="closeTicketModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Subject</label>
          <input id="ticket-subject" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:border-cyan-400 text-white">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Description</label>
          <textarea id="ticket-description" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:border-cyan-400 text-white"></textarea>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Priority</label>
          <select id="ticket-priority" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <button type="button" onclick="createTicket()" class="btn-primary w-full py-3 rounded-xl">Submit Ticket</button>
      </div>
    </div>
  </div>

<script>
  // Demo accounts (no backend needed)
  const ACCOUNTS = {
    'demo@client.com': { password: 'demo123', name: 'John Odhiambo', role: 'client', company: 'Acme Solutions Ltd' },
    'admin@infinitecyberspace.com': { password: 'admin123', name: 'Augustine Ouma', role: 'admin', company: 'Infinite Cyberspace Hub' }
  };

  const demoSubscription = {
    package_name: 'Premium Protection',
    amount: 38900,
    start_date: '2026-07-15',
    end_date: '2026-08-15'
  };

  let clientTickets = JSON.parse(localStorage.getItem('client_tickets') || '[]');

  const clientInvoices = [
    { id: 'INV-001', date: '2026-07-15', amount: 38900, status: 'Paid' },
    { id: 'INV-002', date: '2026-08-01', amount: 38900, status: 'Paid' }
  ];

  const clientReports = [
    { name: 'Monthly Security Report - July 2026', date: '2026-08-01', type: 'PDF' },
    { name: 'Vulnerability Scan Results', date: '2026-07-20', type: 'PDF' },
    { name: 'Employee Training Certificate', date: '2026-07-10', type: 'PDF' }
  ];

  function handleLogin() {
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.classList.add('hidden');

    const account = ACCOUNTS[email];
    if (!account || account.password !== password) {
      errorEl.textContent = 'Invalid email or password';
      errorEl.classList.remove('hidden');
      return;
    }

    if (account.role === 'admin') {
      localStorage.setItem('ich_user', JSON.stringify({ email, ...account }));
      window.location.href = 'admin.html';
      return;
    }

    localStorage.setItem('ich_user', JSON.stringify({ email, name: account.name, role: account.role, company: account.company }));
    localStorage.setItem('customer_logged_in', 'true');
    showPortal();
  }

  function doLogout() {
    localStorage.removeItem('ich_user');
    localStorage.removeItem('customer_logged_in');
    localStorage.removeItem('ich_auth_token');
    location.reload();
  }

  function showPortal() {
    const user = JSON.parse(localStorage.getItem('ich_user') || '{}');

    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('portal').classList.remove('hidden');

    document.getElementById('user-name').textContent =
      (user.name || 'Client') + (user.company ? ' · ' + user.company : '');

    document.getElementById('pkg-name').textContent = demoSubscription.package_name;
    document.getElementById('pkg-period').textContent =
      'Valid from ' + demoSubscription.start_date + ' to ' + demoSubscription.end_date;
    document.getElementById('pkg-amount').textContent =
      'KES ' + demoSubscription.amount.toLocaleString() + ' / month';

    const st = document.getElementById('pkg-status');
    st.textContent = 'ACTIVE';
    st.className = 'px-4 py-1.5 rounded-full text-sm font-medium status-active';

    renderServices();
    renderTickets();
    renderInvoices();
    renderReports();
  }

  function renderServices() {
    const services = [
      '24/7 Threat Monitoring',
      'Endpoint Protection',
      'Email & Phishing Protection',
      'Monthly Security Reports',
      'Priority Support',
      'Employee Training Access'
    ];
    document.getElementById('services-list').innerHTML = services.map(function (s) {
      return '<div class="card p-4 flex justify-between items-center"><span>' + s +
        '</span><span class="text-xs px-2 py-1 rounded status-active">Active</span></div>';
    }).join('');
  }

  function renderTickets() {
    const list = document.getElementById('tickets-list');
    if (!clientTickets.length) {
      list.innerHTML = '<p class="text-slate-500">No tickets yet. Create your first support ticket.</p>';
      return;
    }
    list.innerHTML = clientTickets.map(function (t) {
      return '<div class="card p-4 flex justify-between items-start"><div>' +
        '<div class="font-medium">' + t.subject + '</div>' +
        '<div class="text-sm text-slate-400 mt-1">' + (t.description || '').substring(0, 80) + '...</div>' +
        '<div class="text-xs text-slate-500 mt-2">' + t.date + ' • Priority: ' + t.priority + '</div>' +
        '</div><span class="status-open text-xs px-2 py-1 rounded">' + t.status + '</span></div>';
    }).join('');
  }

  function renderInvoices() {
    document.getElementById('invoices-list').innerHTML =
      '<table class="w-full text-sm"><thead class="text-slate-400"><tr>' +
      '<th class="text-left pb-3">Invoice</th><th class="text-left pb-3">Date</th>' +
      '<th class="text-left pb-3">Amount</th><th class="text-left pb-3">Status</th></tr></thead><tbody>' +
      clientInvoices.map(function (inv) {
        return '<tr class="border-t border-slate-800">' +
          '<td class="py-3 font-medium">' + inv.id + '</td>' +
          '<td class="py-3 text-slate-400">' + inv.date + '</td>' +
          '<td class="py-3 text-emerald-400">KES ' + inv.amount.toLocaleString() + '</td>' +
          '<td class="py-3"><span class="status-active text-xs px-2 py-1 rounded">' + inv.status + '</span></td></tr>';
      }).join('') + '</tbody></table>';
  }

  function renderReports() {
    document.getElementById('reports-list').innerHTML = clientReports.map(function (r) {
      return '<div class="flex justify-between items-center p-4 rounded-lg bg-slate-900/50"><div>' +
        '<div class="font-medium">' + r.name + '</div>' +
        '<div class="text-xs text-slate-500">' + r.date + ' • ' + r.type + '</div></div>' +
        '<button type="button" onclick="alert(\'Download: ' + r.name + '\')" class="btn-primary px-4 py-2 rounded-lg text-sm">' +
        '<i class="fas fa-download"></i> Download</button></div>';
    }).join('');
  }

  function openTicketModal() {
    document.getElementById('ticket-modal').classList.remove('hidden');
    document.getElementById('ticket-modal').classList.add('flex');
  }

  function closeTicketModal() {
    document.getElementById('ticket-modal').classList.add('hidden');
    document.getElementById('ticket-modal').classList.remove('flex');
  }

  function createTicket() {
    var subject = document.getElementById('ticket-subject').value.trim();
    var description = document.getElementById('ticket-description').value.trim();
    var priority = document.getElementById('ticket-priority').value;

    if (!subject || !description) {
      alert('Please fill in subject and description');
      return;
    }

    clientTickets.unshift({
      id: 'TKT-' + Date.now().toString().slice(-6),
      subject: subject,
      description: description,
      priority: priority,
      status: 'Open',
      date: new Date().toLocaleString()
    });
    localStorage.setItem('client_tickets', JSON.stringify(clientTickets));

    closeTicketModal();
    document.getElementById('ticket-subject').value = '';
    document.getElementById('ticket-description').value = '';
    renderTickets();
    alert('Ticket submitted successfully!');
  }

  function showTab(name) {
    ['overview', 'tickets', 'invoices', 'reports'].forEach(function (t) {
      document.getElementById('panel-' + t).classList.add('hidden');
    });
    document.getElementById('panel-' + name).classList.remove('hidden');
  }

  // Auto-show portal if already logged in
  document.addEventListener('DOMContentLoaded', function () {
    if (localStorage.getItem('customer_logged_in') === 'true') {
      var user = JSON.parse(localStorage.getItem('ich_user') || '{}');
      if (user.role === 'client') showPortal();
    }
  });
</script>
</body>
</html>
